<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Victim Care — offline</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      color: #3a1012;
      background: #fff0f0;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      background: #fff;
      border: 1px solid #f3c9c9;
      border-radius: 18px;
      padding: 32px;
      box-shadow: 0 16px 36px rgba(87, 33, 36, 0.08);
    }
    h1 { font-size: 22px; margin: 0 0 10px; }
    p { color: #75494b; line-height: 1.5; }
    a { display: inline-block; margin-top: 12px; color: #9d0208; font-weight: 700; }
  </style>
</head>
<body>
  <div class="card">
    <h1>You are offline</h1>
    <p>Victim Care could not reach the server. The first aid guidance and your settings are still on the device, but new alerts need a connection.</p>
    <p>If you are in immediate danger, call your local emergency number now.</p>
    <a href="/">Try again</a>
  </div>
</body>
</html>
