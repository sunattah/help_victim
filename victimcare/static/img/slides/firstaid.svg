<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="An open first aid kit with bandages, gloves and a plaster">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe3e3"/>
      <stop offset="1" stop-color="#f7a3a3"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="120" cy="110" r="70" fill="#ffffff" opacity="0.35"/>
  <circle cx="700" cy="500" r="90" fill="#ffffff" opacity="0.25"/>

  <!-- open case -->
  <g transform="translate(400 320)">
    <rect x="-210" y="-30" width="420" height="190" rx="20" fill="#d62828"/>
    <rect x="-210" y="-30" width="420" height="34" rx="16" fill="#b01f1f"/>
    <rect x="-26" y="-62" width="52" height="40" rx="12" fill="#b01f1f"/>
    <g transform="translate(0 60)">
      <rect x="-24" y="-84" width="48" height="150" rx="10" fill="#ffffff"/>
      <rect x="-84" y="-24" width="168" height="48" rx="10" fill="#ffffff"/>
    </g>
    <!-- lid -->
    <path d="M-210 -30v-96a20 20 0 0 1 20-20h380a20 20 0 0 1 20 20v96z" fill="#eef2f7"/>
    <path d="M-150 -146v112M-75 -146v112M0 -146v112M75 -146v112M150 -146v112" stroke="#d6dde7" stroke-width="8"/>
  </g>

  <!-- rolled bandage -->
  <g transform="translate(160 470) rotate(-12)">
    <rect x="-56" y="-26" width="112" height="52" rx="26" fill="#fff6e5"/>
    <path d="M-56 0h112" stroke="#e9d8b8" stroke-width="6"/>
    <circle cx="56" cy="0" r="22" fill="#f3e4c6"/>
    <circle cx="56" cy="0" r="9" fill="#fff6e5"/>
  </g>

  <!-- plaster -->
  <g transform="translate(640 460) rotate(24)">
    <rect x="-70" y="-20" width="140" height="40" rx="14" fill="#ffd9a8"/>
    <rect x="-30" y="-20" width="60" height="40" fill="#f6c078"/>
    <g fill="#c98f4a">
      <circle cx="-20" cy="-9" r="3"/><circle cx="0" cy="-9" r="3"/><circle cx="20" cy="-9" r="3"/>
      <circle cx="-20" cy="9" r="3"/><circle cx="0" cy="9" r="3"/><circle cx="20" cy="9" r="3"/>
    </g>
  </g>

  <!-- glove -->
  <g transform="translate(660 160) rotate(18)">
    <path d="M-30 10c-8-32-6-52 4-52s8 22 10 34c2-20 4-40 12-40s8 24 8 36c2-16 6-28 12-26s6 20 4 34c2-10 6-16 11-12s2 22-8 40c-8 14-30 18-40 6z" fill="#ffffff" stroke="#dfe6ee" stroke-width="4"/>
  </g>
</svg>
